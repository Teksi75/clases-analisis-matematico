<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" width="640" height="530">
  <title>Esquema reconstruido: paradoja hidrostática y ejemplo de tres capas</title>
  <desc>Reconstrucción vectorial del esquema manuscrito. Procedencia y omisiones documentadas en revision/diagramas.md.</desc>
  <g fill="none" stroke="#202b65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Recipientes, en el orden de la fotografía -->
    <ellipse cx="100" cy="55" rx="29" ry="17"/>
    <path d="M71 55 L71 160 C71 181 129 181 129 160 L129 55 M71 160 C71 141 129 141 129 160"/>
    <ellipse cx="218" cy="63" rx="13" ry="10"/>
    <path d="M205 63 L205 160 C205 176 231 176 231 160 L231 63 M205 160 C205 147 231 147 231 160"/>
    <path d="M305 43 L352 43 L365 49 L365 161 L352 174 L305 174 Z M305 43 L305 160 L352 160 L352 43 M305 160 L318 145 L365 145 M352 160 L352 174"/>
