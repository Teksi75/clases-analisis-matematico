<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 570" width="440" height="570" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Recipiente de tres fluidos y manómetro</title>
  <desc id="descripcion">Recipiente de cuello angosto con símbolo de superficie libre en el cuello: gas de 80 cm, agua de 35 cm y glicerina de densidad relativa 1,26 y 18 cm. El punto 1 está en la interfaz gas–agua, el 2 en la interfaz agua–glicerina y el 3 en el fondo. A se ubica en la conexión al nivel del fondo según la resolución. El tubo está abierto arriba y su columna de glicerina sube 135 cm sobre la conexión.</desc>
  <rect id="capa-agua" x="105" y="342" width="160" height="84" fill="#bad6da"/>
  <rect id="capa-glicerina" x="105" y="426" width="160" height="43" fill="#94bec6"/>
  <path id="columna-glicerina" d="M265 451 H310 V145 H330 V469 H265 Z" fill="#94bec6"/>
  <g stroke="#202b65" fill="none" stroke-width="3" stroke-linejoin="round">
    <path id="recipiente" d="M165 115 V150 L105 180 V469 H330 V105 M310 105 V451 H265 V180 L205 150 V115"/>
    <path id="labio-cuello" d="M159 115 H211"/>
    <path id="simbolo-superficie" d="M168 135 H202 M173 142 H197 M179 148 H191"/>
    <path id="boca-manometro" d="M304 105 H316 M324 105 H336"/>
    <path id="interfaz-gas-agua" d="M105 342 H265"/>
    <path id="interfaz-agua-glicerina" d="M105 426 H265"/>
    <path id="superficie-manometro" d="M310 145 H330"/>
    <path id="medida-gas" d="M68 150 H80 M74 150 V342 M68 342 H80"/>
    <path id="medida-agua" d="M68 342 H80 M74 342 V426 M68 426 H80"/>
    <path id="medida-glicerina" d="M68 426 H80 M74 426 V469 M68 469 H80"/>
    <path id="medida-columna" d="M350 145 H364 M357 145 V469 M350 469 H364"/>
    <path id="indicador-a" d="M265 469 L286 490"/>
  </g>
  <g fill="#202b65" font-family="sans-serif" font-size="18">
    <text x="185" y="245" text-anchor="middle">Gas</text>
    <text x="185" y="390" text-anchor="middle">Agua</text>
    <text x="185" y="451" text-anchor="middle" font-size="16">Glicerina 1,26</text>
    <text x="12" y="251">80 cm</text><text x="12" y="389">35 cm</text><text x="12" y="454">18 cm</text>
    <text x="367" y="312">135 cm</text>
    <text x="341" y="89" font-size="16">abierto</text><text x="341" y="108" font-size="16">al aire</text>
    <circle id="punto-1" cx="120" cy="342" r="5"/><text x="129" y="336">1</text>
    <circle id="punto-2" cx="120" cy="426" r="5"/><text x="129" y="420">2</text>
    <circle id="punto-3" cx="185" cy="469" r="5"/><text x="185" y="495" text-anchor="middle">3</text>
    <circle id="punto-a" cx="265" cy="469" r="5"/><text x="291" y="503">A</text>
    <text x="220" y="537" text-anchor="middle">A: conexión al nivel del fondo</text>
  </g>
</svg>
