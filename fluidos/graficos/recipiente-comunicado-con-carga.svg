<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Recipiente comunicado con carga sobre un pistón</title>
  <desc id="descripcion">Una carga de 500 kgf empuja hacia abajo el pistón izquierdo, cuya cara inferior toca el líquido comunicado. En la rama derecha abierta a la atmósfera, la superficie libre está por encima de esa cara. El desnivel Δh se mide entre ambas alturas. Esquema sin escala.</desc>
  <polygon id="liquido" points="70,250 180,250 180,315 300,315 300,175 390,175 390,370 70,370" fill="#bad6da"/>
  <g fill="none" stroke="#202b65" stroke-width="3" stroke-linejoin="round">
    <path d="M70 205 V370 H390 V130 M180 205 V315 H300 V130"/>
    <line id="superficie-libre" x1="300" y1="175" x2="390" y2="175"/>
  </g>
  <rect id="piston" x="70" y="230" width="110" height="20" fill="#f2efe6" stroke="#202b65" stroke-width="3"/>
  <g fill="none" stroke="#202b65" stroke-width="2">
    <line id="guia-superficie" x1="250" y1="175" x2="300" y2="175" stroke-dasharray="5 5"/>
    <line id="guia-piston" x1="180" y1="250" x2="250" y2="250" stroke-dasharray="5 5"/>
    <line id="desnivel" x1="250" y1="175" x2="250" y2="250"/>
    <path d="M245 180 L250 175 L255 180 M245 245 L250 250 L255 245"/>
  </g>
  <g stroke="#202b65" stroke-width="4" fill="#202b65">
    <line id="carga" x1="125" y1="115" x2="125" y2="230"/>
    <polygon id="carga-punta" points="125,230 117,214 133,214"/>
  </g>
  <g fill="#202b65" font-family="sans-serif" text-anchor="middle">
    <text x="125" y="95" font-size="21">500 kgf</text>
    <text x="345" y="104" font-size="19">atmósfera</text>
    <text x="270" y="219" font-size="21">Δh</text>
    <text x="230" y="350" font-size="19">líquido</text>
    <text x="220" y="415" font-size="19">Esquema sin escala</text>
  </g>
</svg>
